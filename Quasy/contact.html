<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quasy | Contact Khwezi – Send an Enquiry</title>
  <meta name="description" content="Get in touch with Khwezi, a web development student. Send an enquiry about projects, collaboration or feedback.">
  <meta name="keywords" content="contact Khwezi, hire web developer, web development enquiry, South Africa, collaboration">
  <meta name="author" content="Khwezi">
  <link rel="canonical" href="https://khweziqakosha105.github.io/WEDE-PART-2/contact.html">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="js/map.js" defer></script>
  <script src="js/form.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Quasy</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="skills.html">Skills</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Contact Me</h1>
      </div>
    </section>

    <section class="contact-content">
      <div class="container contact-inner">
        <div class="contact-details">
          <h2>Get in Touch</h2>
          <p>Email: khwezi@example.com</p>
          <p>Location: South Africa</p>
        </div>

        <form class="contact-form" id="contact-form" novalidate>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
          <span class="error-message" id="name-error" aria-live="polite"></span>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <span class="error-message" id="email-error" aria-live="polite"></span>

          <label for="enquiry-type">Enquiry type</label>
          <select id="enquiry-type" name="enquiryType" required>
            <option value="">-- Select an option --</option>
            <option value="general">General question</option>
            <option value="hire">Hire me / project work</option>
            <option value="collab">Collaboration</option>
            <option value="feedback">Feedback on my portfolio</option>
          </select>
          <span class="error-message" id="enquiry-type-error" aria-live="polite"></span>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
          <span class="error-message" id="message-error" aria-live="polite"></span>

          <label class="check"><input type="checkbox" id="copy" name="copy"> Send me a copy of my enquiry</label>
          <label class="check"><input type="checkbox" id="consent" name="consent" required> I agree to be contacted about this enquiry</label>
          <span class="error-message" id="consent-error" aria-live="polite"></span>

          <button type="submit" class="btn">Send Enquiry</button>
          <div class="form-status" id="form-response" role="status" tabindex="-1"></div>
        </form>
      </div>
    </section>

    <section class="map-section">
      <div class="container">
        <h2>Find Me</h2>
        <div id="map" role="region" aria-label="Interactive map showing Khwezi's location"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Khwezi. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
